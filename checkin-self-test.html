
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE YARN FAIR IN TOKYO | Self Check-in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101820;
      color: #fff;
      font-family: Arial, "Noto Sans JP", sans-serif;
      text-align: center;
    }
    header { padding: 20px 12px 8px; }
    h1 { font-size: clamp(20px, 4vw, 30px); margin: 8px; }
    .subtitle { letter-spacing: 3px; color: #ddd; }
    #qr-reader {
      width: min(94vw, 550px);
      margin: 12px auto;
      overflow: hidden;
      border-radius: 12px;
    }
    #status {
      white-space: pre-line;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: bold;
      line-height: 1.5;
      padding: 20px 12px;
      min-height: 130px;
    }
    .success { color: #4be69c; }
    .error { color: #ff9999; }
    .info { color: #fff; }
    button {
      padding: 16px 32px;
      margin: 10px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #101820;
      font-weight: bold;
    }
    button:disabled { opacity: 0.4; }
    .note { color: #ccc; font-size: 14px; padding: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>THE YARN FAIR IN TOKYO™</h1>
    <div class="subtitle">SELF CHECK-IN</div>
  </header>

  <div id="qr-reader"></div>
  <div id="status" role="status" aria-live="polite">
    受付システムを準備しています
  </div>
  <button id="start" type="button" disabled>
    カメラを開始
  </button>
  <p class="note">
    Please hold your QR code in front of the camera.
  </p>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module">
    import { supabase } from './src/supabase.js';

    const statusEl = document.getElementById('status');
    const startButton = document.getElementById('start');

    let scanner = null;
    let processing = false;
    let running = false;
    let authorized = false;

    function show(message, type = 'info') {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function parseToken(rawValue) {
      const raw = String(rawValue || '').trim();

      try {
        const url = new URL(raw);
        return url.searchParams.get('token') || '';
      } catch {
        return raw;
      }
    }

    async function verifyStaff() {
      const { data: { session }, error } =
        await supabase.auth.getSession();

      if (error || !session) {
        show(
          '受付スタッフのログインが必要です\n管理者にお問い合わせください',
          'error'
        );
        return false;
      }

      const { data: profile, error: profileError } =
        await supabase
          .from('staff_profiles')
          .select('role,is_active')
          .eq('user_id', session.user.id)
          .maybeSingle();

      if (
        profileError ||
        !profile ||
        !profile.is_active ||
        !['reception_staff', 'admin'].includes(profile.role)
      ) {
        show('受付権限を確認できません', 'error');
        return false;
      }

      return true;
    }

    async function recordVisitor(rawValue) {
      const token = parseToken(rawValue);

      if (!token) {
        show('QRコードを確認できません', 'error');
        return;
      }

      show('受付処理中です...', 'info');

      const { data, error } = await supabase.rpc(
        'lookup_registration_by_qr',
        { p_qr_token: token }
      );

      if (error || !data?.length) {
        console.error('QR lookup:', error);
        show('QRコードを確認できません\n受付スタッフへお声がけください', 'error');
        return;
      }

      const person = data[0];

      if (person.registration_status !== 'active') {
        show('この登録は現在有効ではありません', 'error');
        return;
      }

      if (Number(person.active_checkin_count) > 0) {
        show(
          `${person.full_name} 様\nすでに受付済みです`,
          'error'
        );
        return;
      }

      const result = await supabase.rpc('record_checkin', {
        p_registration_id: person.registration_id,
        p_device_label: 'Redmi Self Check-in',
        p_force_reentry: false
      });

      if (result.error) {
        console.error('Check-in:', result.error);

        if (result.error.message.includes('ALREADY_CHECKED_IN')) {
          show('すでに受付済みです', 'error');
        } else {
          show(
            '受付処理に失敗しました\n受付スタッフへお声がけください',
            'error'
          );
        }
        return;
      }

      show(
        `${person.company_name || ''}\n${person.full_name} 様\n受付完了 ✓`,
        'success'
      );
    }

    async function onScan(decodedText) {
      if (processing || !running) return;
      processing = true;

      try {
        scanner.pause(true);

        await recordVisitor(decodedText);
      } catch (error) {
        console.error('Unexpected error:', error);
        show('通信エラーが発生しました', 'error');
      } finally {
        setTimeout(() => {
          try {
            if (running && scanner) {
              scanner.resume();
              show('QRコードをかざしてください');
            }
          } catch (error) {
            console.error('Scanner resume:', error);
            running = false;
            startButton.disabled = false;
            show('カメラを再度開始してください', 'error');
          }
          processing = false;
        }, 3000);
      }
    }

    async function startCamera() {
      if (running || processing) return;

      startButton.disabled = true;
      show('カメラを起動しています...');

      try {
        if (!authorized) {
          authorized = await verifyStaff();
          if (!authorized) {
            startButton.disabled = false;
            return;
          }
        }

        if (typeof Html5Qrcode === 'undefined') {
          throw new Error('QR reader library unavailable');
        }

        if (!scanner) {
          scanner = new Html5Qrcode('qr-reader');
        }

        await scanner.start(
          { facingMode: 'user' },
          {
            fps: 10,
            qrbox: { width: 280, height: 280 },
            aspectRatio: 1
          },
          onScan,
          () => {}
        );

        running = true;
        show('QRコードをかざしてください');
      } catch (error) {
        console.error('Camera error:', error);
        running = false;
        startButton.disabled = false;
        show(
          'カメラを起動できません\nカメラの使用を許可してください',
          'error'
        );
      }
    }

    startButton.addEventListener('click', startCamera);

    async function initialize() {
      authorized = await verifyStaff();

      if (authorized) {
        show('カメラを開始してください');
        startButton.disabled = false;
      }
    }

    initialize();
  </script>
</body>
</html>
